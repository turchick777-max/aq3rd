<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100" height="120">
  <defs>
    <!-- Main gradient for the crystal/diamond -->
    <linearGradient id="crystalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4AC8DC;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3AA8C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A7A8A;stop-opacity:1" />
    </linearGradient>

    <!-- Inner drop gradient -->
    <linearGradient id="dropGradient" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#5DD8EC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A8A9A;stop-opacity:1" />
    </linearGradient>

    <!-- Dark inner gradient for depth -->
    <linearGradient id="darkGradient" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1A5A6A;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0A3A4A;stop-opacity:0.9" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer crystal shape - pointed diamond/rhombus -->
  <path d="M50 5
           L85 50
           L50 105
           L15 50 Z"
        fill="url(#crystalGradient)"
        filter="url(#glow)"/>

  <!-- Left facet (darker) -->
  <path d="M50 5
           L15 50
           L50 105
           L50 55 Z"
        fill="url(#darkGradient)"
        opacity="0.6"/>

  <!-- Inner swirl/ribbon effect -->
  <path d="M50 20
           C35 35, 30 55, 35 70
           C40 80, 48 88, 55 88
           C62 88, 68 82, 70 72
           C72 62, 65 45, 50 35
           C42 30, 38 35, 40 45
           C42 55, 50 60, 55 55
           C58 52, 55 48, 50 50"
        fill="none"
        stroke="url(#dropGradient)"
        stroke-width="8"
        stroke-linecap="round"
        opacity="0.9"/>

  <!-- Water drop shape in center -->
  <path d="M50 28
           C50 28, 35 50, 35 62
           C35 75, 42 85, 50 85
           C58 85, 65 75, 65 62
           C65 50, 50 28, 50 28 Z"
        fill="url(#dropGradient)"
        opacity="0.85"/>

  <!-- Highlight on drop -->
  <ellipse cx="42" cy="55" rx="5" ry="8"
           fill="rgba(255,255,255,0.35)"
           transform="rotate(-15 42 55)"/>

  <!-- Small highlight dot -->
  <circle cx="44" cy="48" r="2"
          fill="rgba(255,255,255,0.5)"/>
</svg>
